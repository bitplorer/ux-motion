# Features registry (curated). scripts/codemap.py validates every reference:
# modules and assets must be mapped, ``symbols`` (``module:Name`` or
# ``module:Class.method``) must resolve, and ``tests`` / ``docs`` paths must
# exist (``path::Class::test`` nodes are checked too). The validated entries are
# folded into codemap/index.json, and each module shard lists its features.
# Edit this file in the same PR that moves a feature. See CODEMAP.md.

[[feature]]
id = "plan-ir"
purpose = "IR v1: validate and canonicalize every node kind; additive fields only, unknown kinds and over-cap durations refused."
modules = ["ux_motion._ir", "ux_motion._contract", "ux_motion._schema", "ux_motion._version"]
symbols = [
  "ux_motion._ir:validate_plan",
  "ux_motion._ir:validate_recipe",
  "ux_motion._ir:PlanError",
  "ux_motion._contract:CONTRACT",
  "ux_motion._schema:schema",
]
tests = [
  "tests/test_core.py::CoreTests::test_versions",
  "tests/test_core.py::CoreTests::test_schema",
  "tests/test_core.py::CoreTests::test_unknown_kind_rejected",
  "tests/test_core.py::CoreTests::test_duration_cap",
]
docs = ["docs/02-IR-SPEC.md", "docs/13-VERSIONING.md"]

