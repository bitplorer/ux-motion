symbols = ["ux_motion._dom:motion_tag", "ux_motion._wire:encode_plan_script", "ux_motion._api:Scene.__iter__"]
tests = ["tests/test_render_model.py"]
docs = ["docs/01-ARCHITECTURE.md"]

[[feature]]
id = "presence"
purpose = "Server-side presence helpers: stamp a uid onto markup, render a region, track the Presence set."
