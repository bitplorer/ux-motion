  "ux_motion._api:bind",
  "ux_motion._api:score",
  "ux_motion._api:cue",
  "ux_motion._api:wait",
  "ux_motion._api:Scene.plan",
  "ux_motion._compile:compile_plan",
]
tests = [
  "tests/test_core.py::CoreTests::test_share",
  "tests/test_core.py::CoreTests::test_bind",
  "tests/test_core.py::CoreTests::test_score_and_cue",
]
docs = ["docs/03-API-REFERENCE.md", "docs/04-COMPOSITION-SEMANTICS.md"]

