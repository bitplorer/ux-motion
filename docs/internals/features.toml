assets = ["ux_motion/scripts/ux-motion-player.js"]
symbols = ["ux_motion._api:Motion"]
tests = ["tests/test_player_edges.py", "tests/test_packaging.py"]
docs = ["docs/05-PLAYER-CONTRACT.md"]

[[feature]]
id = "channel-compositor"
purpose = "MotionChannel Document contribution: peel transition.* off a Channel Result, let Channel morph, then play."
modules = ["ux_motion._channel"]
assets = ["ux_motion/scripts/ux-motion-channel.js"]
symbols = ["ux_motion._channel:MotionChannel"]
tests = ["tests/test_core.py::CoreTests::test_motion_channel_is_a_contribution", "tests/test_packaging.py"]
docs = ["docs/14-CHANNEL-COMPOSITOR.md"]

[[feature]]
id = "ux-dom-face"
purpose = "A Scene placed in a ux-dom tree renders as a Component whose only child is the plan script."
