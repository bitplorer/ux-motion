name: Bug report
description: Something does not work the way the docs or public API say it should.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for a precise report. Security issues must go through SECURITY.md, not this form.
  - type: input
    id: package
    attributes:
      label: Package
      placeholder: ux-motion
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
      placeholder: "1.3.0 or git SHA"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Actual vs expected. Quote the public API (`ux_motion.__all__`).
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      render: python
    validations:
      required: true
