name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    name: test (py3.14)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install
        run: |
          python -m pip install -U pip setuptools wheel
          pip install -e .
      - name: Unit tests
        run: PYTHONPATH=. python -m unittest discover -s tests -v
