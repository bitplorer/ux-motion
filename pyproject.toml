[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ux-motion"
version = "1.3.0"
description = "Server-authored, composable presence and transition plans for Python + JSON channels"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.14"
authors = [{ name = "ux_motion contributors" }]
keywords = [
  "animation",
  "presence",
  "transition",
  "ux-channel",
  "server-driven",
  "motion",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries",
]
dependencies = []

[project.optional-dependencies]
# Peer: render layer. Pin to ux-dom main after F-16 (F-14 alignment).
ux-dom = ["ux-dom @ git+https://github.com/bitplorer/ux-dom.git@19af869ecbb108f3cf779111838e3359b33a8131"]

[project.urls]
Homepage = "https://github.com/bitplorer/ux-motion"
Repository = "https://github.com/bitplorer/ux-motion"
Documentation = "https://github.com/bitplorer/ux-motion/tree/main/docs"
Changelog = "https://github.com/bitplorer/ux-motion/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["ux_motion*"]

[tool.setuptools.package-data]
ux_motion = ["py.typed", "scripts/*.js"]
